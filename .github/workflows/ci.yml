name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compilar-y-probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restaurar dependencias
        run: dotnet restore

      - name: Compilar
        run: dotnet build --no-restore --configuration Release

      - name: Ejecutar pruebas
        run: dotnet test --no-build --configuration Release

  publicar:
    # Solo se publica lo que llega a main con las pruebas en verde.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: compilar-y-probar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Compilar la aplicación
        run: dotnet publish src/Casos.Web --configuration Release --output publicacion

      # Sin .nojekyll, GitHub Pages ignora la carpeta _framework porque empieza con guion bajo.
      - name: Preparar para GitHub Pages
        run: touch publicacion/wwwroot/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: publicacion/wwwroot

      - id: despliegue
        uses: actions/deploy-pages@v5
